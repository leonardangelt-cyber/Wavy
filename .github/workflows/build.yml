name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Projekt vorbereiten (ZIP entpacken falls nötig)
        run: |
          if ! find . -name settings.gradle.kts -not -path './.git/*' | grep -q .; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Weder settings.gradle.kts noch eine ZIP-Datei im Repo gefunden."
              ls -R . | head -n 50
              exit 1
            fi
            echo "Entpacke $ZIP"
            mkdir -p "$GITHUB_WORKSPACE/proj"
            unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/proj"
          fi
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wavy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
