name: APK bauen

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quelle finden
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Entpacke $ZIP"
            rm -rf work
            mkdir work
            unzip -q "$ZIP" -d work
            SEARCH=work
          else
            echo "Keine ZIP im Hauptordner, suche direkt im Repo"
            SEARCH=.
          fi
          F=$(find "$SEARCH" -maxdepth 4 -name 'settings.gradle*' -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "Keine settings.gradle(.kts) gefunden."
            ls -R . | head -n 60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Projektordner: $(dirname "$F")"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK bauen (Release, schnell)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          NET="-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=2000"
          for i in 1 2 3; do
            if gradle assembleRelease --console=plain $NET 2>&1 | tee "build-$i.log"; then
              exit 0
            fi
            echo "Versuch $i fehlgeschlagen"
            sleep 20
          done
          {
            echo "### Fehler-Zusammenfassung"
            echo '```'
            grep -h -E "^e: |What went wrong|Could not|Execution failed|Unresolved|error:|R8|Missing class" -A3 build-1.log build-3.log | head -n 70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=========== FEHLER-ZUSAMMENFASSUNG ==========="
          grep -h -E "^e: |What went wrong|Could not|Execution failed|Unresolved|error:|R8|Missing class" -A3 build-1.log build-3.log | head -n 70 || true
          exit 1

      - name: APK umbenennen
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name '*.apk' | head -n 1)
          cp "$APK" Wavy.apk
          ls -l Wavy.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Wavy-APK
          path: Wavy.apk
          if-no-files-found: error

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Wavy.apk \
            --title "Wavy Build ${{ github.run_number }}" \
            --notes "Automatischer Build Nr. ${{ github.run_number }}"
