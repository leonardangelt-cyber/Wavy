name: APK bauen

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quelle finden
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Entpacke $ZIP"
            rm -rf work
            mkdir work
            unzip -q "$ZIP" -d work
            SEARCH=work
          else
            echo "Keine ZIP im Hauptordner, suche direkt im Repo"
            SEARCH=.
          fi
          F=$(find "$SEARCH" -maxdepth 4 -name 'settings.gradle*' -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "Keine settings.gradle(.kts) gefunden."
            ls -R . | head -n 60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Projektordner: $(dirname "$F")"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK bauen
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --stacktrace && exit 0
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 20 s"
            sleep 20
          done
          exit 1

      - name: APK umbenennen
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' | head -n 1)
          cp "$APK" Wavy.apk
          ls -l Wavy.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Wavy-APK
          path: Wavy.apk
          if-no-files-found: error

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Wavy.apk \
            --title "Wavy Build ${{ github.run_number }}" \
            --notes "Automatischer Build Nr. ${{ github.run_number }}"
